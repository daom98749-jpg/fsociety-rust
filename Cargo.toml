[package]
name = "fsociety-toolkit"
version = "1.0.0"
edition = "2021"
description = "Network recon toolkit - IP info, port scan, DNS, WHOIS, HTTP header check"
license = "MIT"

[[bin]]
name = "fsociety-toolkit"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
